name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Restore Cachew downloads
        id: cachew-cache
        uses: actions/cache/restore@v6
        with:
          path: build/cachew
          key: cachew-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testdata/cachew.hcl') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cachew-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testdata/cachew.hcl') }}-
            cachew-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Run tests through Cachew
        run: ./scripts/test-with-cachew.sh go run gotest.tools/gotestsum@latest --format testdox -- -race -cover ./...

      - name: Save Cachew downloads
        if: always() && steps.cachew-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: build/cachew
          key: ${{ steps.cachew-cache.outputs.cache-primary-key }}

  release:
    name: Publish Release Binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
