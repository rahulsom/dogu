name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  suite:
    name: Test Suite
    uses: ./.github/workflows/test.yml

  test:
    name: Run Tests
    if: always()
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - name: Require the test suite to pass
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: test "$SUITE_RESULT" = success

  deploy-docs:
    name: Publish Docs to GitHub Pages
    needs: suite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate tool examples
        run: go test ./pkg/cli -run '^TestToolExampleDocs$' -count=1

      - name: Install Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Build docs
        run: |
          mkdir -p build/docs/images
          cp images/toolbox.png images/favicon.ico build/docs/images/
          cp docs/style.css build/docs/
          asciidoctor \
              -a favicon=images/favicon.ico \
              -a imagesdir=images \
              -D build/docs \
              docs/index.adoc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
