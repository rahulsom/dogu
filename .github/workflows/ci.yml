name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Restore Cachew downloads
        id: cachew-cache
        uses: actions/cache/restore@v6
        with:
          path: build/cachew
          key: cachew-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testdata/cachew.hcl') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cachew-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('testdata/cachew.hcl') }}-
            cachew-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install prerequisites for documented examples
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cabal-install pkg-config \
            libgmp-dev libnuma-dev libffi-dev libncurses-dev libreadline-dev libssl-dev \
            libyaml-dev zlib1g-dev libbz2-dev liblzma-dev libpcre2-dev \
            libcurl4-openssl-dev libcairo2-dev libpango1.0-dev libjpeg-dev \
            libgif-dev librsvg2-dev libpng-dev graphviz
          cabal update

      - name: Run tests through Cachew
        env:
          CACHEW_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/test-with-cachew.sh go run gotest.tools/gotestsum@latest --format testdox
          --packages="./..." --rerun-fails=2 --rerun-fails-abort-on-data-race
          -- -timeout 90m -race -cover

      - name: Save Cachew downloads
        if: always() && steps.cachew-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: build/cachew
          key: ${{ steps.cachew-cache.outputs.cache-primary-key }}

  deploy-docs:
    name: Publish Docs to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate tool examples
        run: go test ./pkg/cli -run '^TestToolExampleDocs$' -count=1

      - name: Install Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Build docs
        run: |
          mkdir -p build/docs/images
          cp images/toolbox.png images/favicon.ico build/docs/images/
          cp docs/style.css build/docs/
          asciidoctor \
              -a favicon=images/favicon.ico \
              -a imagesdir=images \
              -D build/docs \
              docs/index.adoc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
