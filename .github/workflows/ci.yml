name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests with race detection
        if: runner.os == 'Linux'
        run: go test -race -cover ./...

      - name: Run unit tests
        if: runner.os == 'Windows'
        run: go test -cover ./...

  integration:
    needs: unit
    name: Live Integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [erd, r, ruby, remaining]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Restore Cachew downloads
        id: cachew-cache
        uses: actions/cache/restore@v6
        with:
          path: build/cachew
          key: cachew-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('testdata/cachew.hcl') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cachew-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('testdata/cachew.hcl') }}-

      - name: Install prerequisites for documented examples
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            erd) packages=(cabal-install libgmp-dev libnuma-dev libffi-dev libncurses-dev) ;;
            r) packages=(gfortran libreadline-dev libcurl4-openssl-dev libpcre2-dev zlib1g-dev libbz2-dev liblzma-dev) ;;
            ruby) packages=(libssl-dev libyaml-dev libreadline-dev zlib1g-dev libffi-dev libgmp-dev) ;;
            remaining) packages=(libgmp-dev libnuma-dev libffi-dev libncurses-dev libssl-dev libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpng-dev graphviz) ;;
          esac
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config "${packages[@]}"
          if [[ "$SHARD" == erd ]]; then
            time cabal update
          fi

      - name: Run live tests through Cachew
        env:
          CACHEW_GITHUB_TOKEN: ${{ github.token }}
          DOGU_EXAMPLE_SHARD: ${{ matrix.shard }}
        run: |
          tests='TestToolExampleIntegrations'
          if [[ "$DOGU_EXAMPLE_SHARD" == remaining ]]; then
            tests+='|TestMirrorIntegration|TestToolIntegrations'
          fi
          time ./scripts/test-with-cachew.sh go run gotest.tools/gotestsum@latest --format testdox \
            --packages="./pkg/cli" --rerun-fails=2 --rerun-fails-abort-on-data-race \
            -- -run "^($tests)$" -count=1 -timeout 90m -race -cover

      - name: Save Cachew downloads
        if: always() && steps.cachew-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: build/cachew
          key: ${{ steps.cachew-cache.outputs.cache-primary-key }}

  test:
    name: Run Tests
    if: always()
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all test jobs to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$UNIT_RESULT" = success && test "$INTEGRATION_RESULT" = success

  deploy-docs:
    name: Publish Docs to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate tool examples
        run: go test ./pkg/cli -run '^TestToolExampleDocs$' -count=1

      - name: Install Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Build docs
        run: |
          mkdir -p build/docs/images
          cp images/toolbox.png images/favicon.ico build/docs/images/
          cp docs/style.css build/docs/
          asciidoctor \
              -a favicon=images/favicon.ico \
              -a imagesdir=images \
              -D build/docs \
              docs/index.adoc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
