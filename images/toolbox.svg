<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Toolbox Gradients -->
    <linearGradient id="redBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="50%" stop-color="#c53030"/>
      <stop offset="100%" stop-color="#9b2c2c"/>
    </linearGradient>

    <linearGradient id="redLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fc8181"/>
      <stop offset="30%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#9b2c2c"/>
    </linearGradient>

    <linearGradient id="redHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#feb2b2"/>
      <stop offset="100%" stop-color="#e53e3e"/>
    </linearGradient>

    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf2f7"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e0"/>
      <stop offset="100%" stop-color="#a0aec0"/>
    </linearGradient>

    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e0"/>
      <stop offset="50%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>

    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dd6b20"/>
      <stop offset="50%" stop-color="#c05621"/>
      <stop offset="100%" stop-color="#7b341e"/>
    </linearGradient>

    <linearGradient id="yellowGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6e05e"/>
      <stop offset="50%" stop-color="#ecc94b"/>
      <stop offset="100%" stop-color="#d69e2e"/>
    </linearGradient>

    <linearGradient id="blueGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4299e1"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Group for entire artwork with soft drop shadow -->
  <g filter="url(#shadow)">

    <!-- ==================== TOOLS INSIDE ==================== -->
    <g id="tools">
      <!-- 1. Hammer (Angled Left) -->
      <g transform="translate(140, 150) rotate(-28)">
        <!-- Handle -->
        <rect x="-10" y="0" width="20" height="150" rx="4" fill="url(#woodHandle)"/>
        <rect x="-10" y="100" width="20" height="45" rx="3" fill="#2d3748" opacity="0.8"/>
        <!-- Hammer Head -->
        <path d="M -35 -20 L 25 -20 L 30 -12 L 15 -10 L 15 10 L -15 10 L -15 -10 L -30 -5 C -35 0 -40 10 -42 20 L -48 18 C -45 5 -38 -10 -35 -20 Z" fill="url(#metalDark)"/>
        <!-- Steel Face -->
        <rect x="25" y="-22" width="10" height="24" rx="2" fill="url(#metalSilver)"/>
      </g>

      <!-- 2. Screwdriver (Center-Right, Angled Slight Right) -->
      <g transform="translate(310, 130) rotate(15)">
        <!-- Shaft -->
        <rect x="-4" y="-20" width="8" height="120" rx="2" fill="url(#metalSilver)"/>
        <!-- Tip -->
        <path d="M -4 -20 L 0 -28 L 4 -20 Z" fill="url(#metalDark)"/>
        <!-- Handle -->
        <path d="M -12 60 L 12 60 L 14 110 C 14 120 10 130 0 130 C -10 130 -14 120 -14 110 Z" fill="url(#yellowGrip)"/>
        <!-- Handle Rubber Grip Strips -->
        <rect x="-12" y="72" width="24" height="6" rx="2" fill="#1a202c"/>
        <rect x="-13" y="86" width="26" height="6" rx="2" fill="#1a202c"/>
        <rect x="-12" y="100" width="24" height="6" rx="2" fill="#1a202c"/>
      </g>

      <!-- 3. Adjustable Wrench / Spanner (Angled Right) -->
      <g transform="translate(250, 120) rotate(32)">
        <!-- Handle -->
        <path d="M -8 20 L 8 20 L 6 140 C 6 145 0 148 -6 145 Z" fill="url(#metalSilver)"/>
        <circle cx="0" cy="132" r="4" fill="#718096"/>
        <!-- Wrench Head -->
        <path d="M -20 -15 C -20 -35 20 -35 20 -15 C 20 -5 12 5 0 5 C -12 5 -20 -5 -20 -15 Z" fill="url(#metalSilver)"/>
        <path d="M -10 -30 L 5 -30 L 5 -10 L -10 -10 Z" fill="#2d3748"/>
        <!-- Thumb Screw Knob -->
        <rect x="-4" y="-8" width="12" height="8" rx="1" fill="url(#metalDark)"/>
      </g>

      <!-- 4. Pliers (Angled Far Left) -->
      <g transform="translate(180, 135) rotate(-12)">
        <!-- Handles -->
        <path d="M -12 30 C -15 60 -18 90 -12 120" stroke="url(#blueGrip)" stroke-width="10" stroke-linecap="round" fill="none"/>
        <path d="M 12 30 C 15 60 18 90 12 120" stroke="url(#blueGrip)" stroke-width="10" stroke-linecap="round" fill="none"/>
        <!-- Pivot / Head -->
        <circle cx="0" cy="25" r="10" fill="url(#metalDark)"/>
        <circle cx="0" cy="25" r="4" fill="url(#metalSilver)"/>
        <path d="M -8 18 L -4 -10 L 0 25 L 4 -10 L 8 18 Z" fill="url(#metalSilver)"/>
      </g>
    </g>

    <!-- ==================== TOOLBOX BODY ==================== -->
    <g id="toolbox">
      <!-- Toolbox Interior Dark Opening Shadow -->
      <path d="M 60 190 L 440 190 L 430 220 L 70 220 Z" fill="#1a202c"/>

      <!-- Toolbox Back Open Lid -->
      <path d="M 60 190 L 80 100 L 420 100 L 440 190 Z" fill="url(#redLid)"/>
      <!-- Lid Rim / Lip -->
      <path d="M 75 100 L 425 100 L 428 108 L 72 108 Z" fill="url(#redHighlight)"/>
      <!-- Lid Metal Reinforcement Strips -->
      <rect x="120" y="105" width="8" height="80" fill="url(#metalSilver)" opacity="0.7"/>
      <rect x="372" y="105" width="8" height="80" fill="url(#metalSilver)" opacity="0.7"/>

      <!-- Toolbox Main Lower Cabinet / Front Body -->
      <path d="M 50 210 L 450 210 L 435 350 C 435 355 430 360 420 360 L 80 360 C 70 360 65 355 65 350 Z" fill="url(#redBody)"/>

      <!-- Toolbox Top Bevel / Rim -->
      <path d="M 45 205 L 455 205 C 458 205 460 208 458 212 L 450 222 L 50 222 L 42 212 C 40 208 42 205 45 205 Z" fill="url(#redHighlight)"/>

      <!-- Side Carry Handles -->
      <!-- Left Handle -->
      <path d="M 45 260 C 30 260 30 300 45 300" stroke="url(#metalSilver)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <rect x="42" y="252" width="8" height="16" rx="2" fill="url(#metalDark)"/>
      <rect x="42" y="292" width="8" height="16" rx="2" fill="url(#metalDark)"/>
      <!-- Right Handle -->
      <path d="M 455 260 C 470 260 470 300 455 300" stroke="url(#metalSilver)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <rect x="450" y="252" width="8" height="16" rx="2" fill="url(#metalDark)"/>
      <rect x="450" y="292" width="8" height="16" rx="2" fill="url(#metalDark)"/>

      <!-- Metal Latches on Front Body -->
      <!-- Left Latch -->
      <rect x="120" y="218" width="24" height="36" rx="3" fill="url(#metalSilver)"/>
      <rect x="124" y="224" width="16" height="12" rx="1" fill="url(#metalDark)"/>
      <circle cx="132" cy="246" r="3" fill="#4a5568"/>

      <!-- Right Latch -->
      <rect x="356" y="218" width="24" height="36" rx="3" fill="url(#metalSilver)"/>
      <rect x="360" y="224" width="16" height="12" rx="1" fill="url(#metalDark)"/>
      <circle cx="368" cy="246" r="3" fill="#4a5568"/>

      <!-- Center Metal Lock Loop -->
      <rect x="238" y="220" width="24" height="28" rx="2" fill="url(#metalSilver)"/>
      <circle cx="250" cy="234" r="5" fill="#2d3748"/>

      <!-- Bottom Corner Metallic Reinforcements -->
      <path d="M 65 330 L 85 330 L 85 360 L 80 360 C 72 360 67 355 65 348 Z" fill="url(#metalSilver)"/>
      <circle cx="75" cy="345" r="2" fill="#4a5568"/>

      <path d="M 435 330 L 415 330 L 415 360 L 420 360 C 428 360 433 355 435 348 Z" fill="url(#metalSilver)"/>
      <circle cx="425" cy="345" r="2" fill="#4a5568"/>

      <!-- ==================== KOREAN TEXT "도구" ==================== -->
      <!-- Front Badge Panel -->
      <rect x="170" y="270" width="160" height="62" rx="8" fill="#7f1d1d" opacity="0.6"/>
      <rect x="172" y="272" width="156" height="58" rx="6" fill="none" stroke="url(#metalSilver)" stroke-width="2"/>

      <!-- Text "도구" -->
      <text x="250" y="316" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif, system-ui" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#softGlow)">도구</text>
    </g>
  </g>
</svg>
